<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nexpak Company System V6</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b1220;
    color: white;
}

/* TOP BAR */
header {
    background: #111827;
    padding: 15px;
    display: flex;
    justify-content: space-between;
}

/* LAYOUT */
.container {
    padding: 20px;
    max-width: 1000px;
    margin: auto;
}

/* INPUTS */
input, select {
    width: 100%;
    padding: 10px;
    margin: 5px 0;
}

/* BUTTON */
button {
    padding: 10px;
    background: #38bdf8;
    border: none;
    font-weight: bold;
    cursor: pointer;
}

/* CARDS */
.card {
    background: #111827;
    padding: 10px;
    margin: 10px 0;
    border-radius: 8px;
}

/* ADMIN */
.admin {
    display: none;
}

.badge {
    background: #38bdf8;
    padding: 5px 10px;
    border-radius: 5px;
    font-size: 12px;
}
</style>
</head>

<body>

<header>
    <div><b>Nexpak System V6</b></div>
    <div>
        <span class="badge" onclick="toggleAdmin()">ADMIN</span>
    </div>
</header>

<div class="container">

<!-- PUBLIC SECTION -->
<div id="public">

<h2>Request Instant Quote</h2>

<input id="name" placeholder="Your Name">
<input id="phone" placeholder="Phone Number">

<select id="product"></select>

<input id="qty" placeholder="Quantity">

<button onclick="sendQuote()">Send WhatsApp Quote</button>

<hr>

<h3>Products</h3>
<div id="productList"></div>

</div>

<!-- ADMIN SECTION -->
<div id="admin" class="admin">

<h2>Admin Dashboard</h2>

<h3>Leads</h3>
<div id="leads"></div>

<h3>Analytics</h3>
<div id="stats"></div>

</div>

</div>

<script>

// PRODUCT DATABASE
const PRODUCTS = [
  {name:"Fire Seals Branded", price:1.45},
  {name:"Fire Seals Unbranded", price:1.25},
  {name:"Stretch Film", price:25},
  {name:"Bubble Wrap", price:30},
  {name:"Long Straps 280mm", price:1.19},
  {name:"Short Straps", price:0.90}
];

// LOAD DROPDOWN + PRODUCTS
let select = document.getElementById("product");
let list = document.getElementById("productList");

PRODUCTS.forEach(p => {
    select.innerHTML += `<option>${p.name}</option>`;
    list.innerHTML += `
        <div class="card">
            <b>${p.name}</b><br>
            Price: R${p.price}
        </div>
    `;
});

// SEND QUOTE (WHATSAPP + SAVE LEAD)
function sendQuote(){

    let name = document.getElementById("name").value;
    let phone = document.getElementById("phone").value;
    let product = document.getElementById("product").value;
    let qty = document.getElementById("qty").value;

    if(!name || !phone || !product || !qty){
        alert("Fill all fields");
        return;
    }

    let msg =
`NEW QUOTE REQUEST:
Name: ${name}
Phone: ${phone}
Product: ${product}
Qty: ${qty}`;

    window.open("https://wa.me/27YOURNUMBER?text=" + encodeURIComponent(msg));

    // SAVE LEAD
    let leads = JSON.parse(localStorage.getItem("leads") || "[]");

    leads.push({
        name,
        phone,
        product,
        qty,
        date: new Date()
    });

    localStorage.setItem("leads", JSON.stringify(leads));
}

// TOGGLE ADMIN
function toggleAdmin(){
    let pass = prompt("Enter Admin Password");

    if(pass === "1234"){
        document.getElementById("admin").style.display = "block";
        loadAdmin();
    } else {
        alert("Wrong password");
    }
}

// LOAD ADMIN DATA
function loadAdmin(){

    let leads = JSON.parse(localStorage.getItem("leads") || "[]");

    let leadHTML = "";

    leads.forEach((l,i)=>{
        leadHTML += `
        <div class="card">
            <b>${l.name}</b><br>
            ${l.phone}<br>
            ${l.product} x${l.qty}<br>
            <button onclick="deleteLead(${i})">Delete</button>
        </div>`;
    });

    document.getElementById("leads").innerHTML = leadHTML;

    // ANALYTICS
    let stats = {};

    leads.forEach(l=>{
        stats[l.product] = (stats[l.product] || 0) + 1;
    });

    document.getElementById("stats").innerHTML =
        JSON.stringify(stats, null, 2);
}

// DELETE LEAD
function deleteLead(i){
    let leads = JSON.parse(localStorage.getItem("leads") || "[]");
    leads.splice(i,1);
    localStorage.setItem("leads", JSON.stringify(leads));
    loadAdmin();
}

</script>

</body>
</html>
