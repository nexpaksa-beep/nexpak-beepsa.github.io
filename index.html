<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexpak Solutions | Business System</title>

<style>
body {
    margin:0;
    font-family:Arial;
    background:#0b1220;
    color:white;
}

/* HEADER */
header {
    background:#111827;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

/* SECTIONS */
.container {
    padding:20px;
    max-width:1000px;
    margin:auto;
}

/* CARDS */
.card {
    background:#111827;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
}

/* INPUTS */
input, select {
    width:100%;
    padding:10px;
    margin:6px 0;
}

/* BUTTON */
button {
    padding:10px;
    background:#38bdf8;
    border:none;
    font-weight:bold;
    cursor:pointer;
}

/* ADMIN */
#adminPanel {
    display:none;
}

/* BADGE */
.badge {
    background:#38bdf8;
    padding:5px 10px;
    border-radius:6px;
    cursor:pointer;
}
</style>

</head>

<body>

<header>
    <div><b>Nexpak Business System V7</b></div>
    <div class="badge" onclick="openAdmin()">ADMIN</div>
</header>

<div class="container">

<!-- PUBLIC SYSTEM -->
<div id="public">

<h2>Get Instant Quote</h2>

<input id="name" placeholder="Your Name">
<input id="phone" placeholder="Phone Number">

<select id="product"></select>

<input id="qty" placeholder="Quantity">

<button onclick="sendQuote()">Send WhatsApp Quote</button>

<hr>

<h3>Products</h3>
<div id="products"></div>

</div>

<!-- ADMIN SYSTEM -->
<div id="adminPanel">

<h2>Admin Dashboard</h2>

<div id="leads"></div>

<h3>Analytics</h3>
<pre id="stats"></pre>

<button onclick="clearLeads()">Clear All Leads</button>

</div>

</div>

<script>

/* =========================
PRODUCT DATABASE
========================= */
const PRODUCTS = [
  {name:"Fire Seals Branded", price:1.45},
  {name:"Fire Seals Unbranded", price:1.25},
  {name:"Stretch Film", price:25},
  {name:"Bubble Wrap", price:30},
  {name:"Long Straps 280mm", price:1.19},
  {name:"Short Straps", price:0.90}
];

/* =========================
LOAD PRODUCTS
========================= */
let select = document.getElementById("product");
let productBox = document.getElementById("products");

PRODUCTS.forEach(p=>{
    select.innerHTML += `<option>${p.name}</option>`;
    productBox.innerHTML += `
        <div class="card">
            <b>${p.name}</b><br>
            R${p.price}
        </div>
    `;
});

/* =========================
SEND QUOTE (WHATSAPP + SAVE)
========================= */
function sendQuote(){

    if(!name.value || !phone.value || !product.value || !qty.value){
        alert("Fill all fields");
        return;
    }

    let message =
`NEW QUOTE REQUEST:
Name: ${name.value}
Phone: ${phone.value}
Product: ${product.value}
Quantity: ${qty.value}`;

    window.open("https://wa.me/27YOURNUMBER?text=" + encodeURIComponent(message));

    let leads = JSON.parse(localStorage.getItem("leads") || "[]");

    leads.push({
        name:name.value,
        phone:phone.value,
        product:product.value,
        qty:qty.value,
        date:new Date()
    });

    localStorage.setItem("leads", JSON.stringify(leads));

    alert("Quote sent!");
}

/* =========================
ADMIN ACCESS
========================= */
function openAdmin(){

    let pass = prompt("Enter Admin Password");

    if(pass !== "1234"){
        alert("Wrong password");
        return;
    }

    document.getElementById("public").style.display = "none";
    document.getElementById("adminPanel").style.display = "block";

    loadAdmin();
}

/* =========================
LOAD ADMIN DATA
========================= */
function loadAdmin(){

    let leads = JSON.parse(localStorage.getItem("leads") || "[]");

    let html = "";

    leads.forEach((l,i)=>{
        html += `
        <div class="card">
            <b>${l.name}</b><br>
            ${l.phone}<br>
            ${l.product} x ${l.qty}<br>
            <button onclick="deleteLead(${i})">Delete</button>
        </div>`;
    });

    document.getElementById("leads").innerHTML = html;

    // ANALYTICS
    let stats = {};

    leads.forEach(l=>{
        stats[l.product] = (stats[l.product] || 0) + 1;
    });

    document.getElementById("stats").innerText =
        JSON.stringify(stats, null, 2);
}

/* =========================
DELETE LEAD
========================= */
function deleteLead(i){

    let leads = JSON.parse(localStorage.getItem("leads") || "[]");

    leads.splice(i,1);

    localStorage.setItem("leads", JSON.stringify(leads));

    loadAdmin();
}

/* =========================
CLEAR ALL LEADS
========================= */
function clearLeads(){

    if(confirm("Delete all leads?")){

        localStorage.removeItem("leads");
        loadAdmin();
    }
}

</script>

</body>
</html>
