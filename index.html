<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Nexpak V5 Cloud System</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b1220;
    color: white;
}

.login-box, .dashboard {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.login-box {
    margin-top: 100px;
    background: #111827;
    border-radius: 10px;
}

input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
}

button {
    padding: 10px;
    background: #38bdf8;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

.card {
    background: #111827;
    padding: 15px;
    margin-top: 10px;
    border-radius: 8px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
    gap: 10px;
}

.hidden { display: none; }
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login-box" id="loginBox">
    <h2>Admin Login</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->
<div class="dashboard hidden" id="dashboard">

    <h2>📊 Nexpak Cloud CRM V5</h2>

    <button onclick="logout()">Logout</button>

    <h3>New Lead</h3>

    <input id="name" placeholder="Customer Name">
    <input id="phone" placeholder="Phone">
    <input id="product" placeholder="Product">
    <input id="qty" placeholder="Quantity">

    <button onclick="addLead()">Save Lead</button>

    <h3>Live Leads</h3>
    <div class="grid" id="leads"></div>

</div>

<script>

// FIREBASE CONFIG (YOU REPLACE THIS)
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_PROJECT",
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// LOGIN
function login(){
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    auth.signInWithEmailAndPassword(email, password)
    .then(() => {
        document.getElementById("loginBox").classList.add("hidden");
        document.getElementById("dashboard").classList.remove("hidden");
        loadLeads();
    })
    .catch(err => alert(err.message));
}

// LOGOUT
function logout(){
    auth.signOut();
    location.reload();
}

// ADD LEAD (CLOUD)
function addLead(){

    db.collection("leads").add({
        name: name.value,
        phone: phone.value,
        product: product.value,
        qty: qty.value,
        time: new Date()
    });

    alert("Lead saved to cloud!");
}

// LOAD LEADS REALTIME
function loadLeads(){

    db.collection("leads").orderBy("time", "desc")
    .onSnapshot(snapshot => {

        let html = "";

        snapshot.forEach(doc => {

            let d = doc.data();

            html += `
            <div class="card">
                <b>${d.name}</b><br>
                ${d.phone}<br>
                ${d.product} (${d.qty})<br><br>

                <button onclick="sendWhatsApp('${d.phone}','${d.product}','${d.qty}')">
                    WhatsApp
                </button>
            </div>
            `;
        });

        document.getElementById("leads").innerHTML = html;
    });
}

// WHATSAPP AUTO MESSAGE
function sendWhatsApp(phone, product, qty){

    let msg = `Hi, regarding your order: ${product} x${qty}`;

    window.open("https://wa.me/27" + phone + "?text=" + encodeURIComponent(msg));
}

// AUTH STATE
auth.onAuthStateChanged(user => {
    if(user){
        document.getElementById("loginBox").classList.add("hidden");
        document.getElementById("dashboard").classList.remove("hidden");
        loadLeads();
    }
});

</script>

</body>
</html>
