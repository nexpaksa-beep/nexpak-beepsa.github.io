    <style>
        .hero-section {
            position: relative;
            height: 80vh;
            min-height: 500px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }
        .hero-slider {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
        }
        .hero-slide {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }
        .hero-slide.active { opacity: 1; }
        .hero-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 0;
        }
        .hero-content { position: relative; z-index: 1; padding: 2rem; }
    </style>

    <section class="hero-section">
        <div class="hero-slider">
            <div class="hero-slide active" style="background-image: url('images/hero.png')"></div>
            <div class="hero-slide" style="background-image: url('images/hero2.png')"></div>
            <div class="hero-slide" style="background-image: url('images/hero3.png')"></div>
        </div>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1>Advanced Security Solutions</h1>
            <p>Protecting what matters most with cutting-edge technology.</p>
        </div>
    </section>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.hero-slide');
        setInterval(() => {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }, 5000);
    </script>
