<style>

/* =========================================================
 NEXPAK TECHNICAL PAGE
 GLOBAL FOUNDATION
 ========================================================= */

:root {

    --nx-black: #05080d;
    --nx-black-2: #080d14;
    --nx-panel: #0b1119;
    --nx-panel-2: #101923;

    --nx-blue: #168cff;
    --nx-blue-bright: #39a8ff;
    --nx-cyan: #00d9ff;

    --nx-white: #f4f8fc;
    --nx-text: #b7c3d0;
    --nx-muted: #728092;

    --nx-line: rgba(255,255,255,0.08);
    --nx-line-blue: rgba(22,140,255,0.28);

    --nx-radius: 18px;

    --nx-container: 1380px;

    --nx-shadow:
        0 25px 80px rgba(0,0,0,0.45);

}


/* =========================================================
 RESET
 ========================================================= */

* {

    margin: 0;
    padding: 0;

    box-sizing: border-box;

}


html {

    scroll-behavior: smooth;

}


body {

    background:
        radial-gradient(
            circle at 75% 20%,
            rgba(0,140,255,0.08),
            transparent 32%
        ),
        var(--nx-black);

    color: var(--nx-white);

    font-family:
        "Inter",
        Arial,
        sans-serif;

    line-height: 1.6;

    overflow-x: hidden;

}


/* =========================================================
 TECHNICAL GRID BACKGROUND
 ========================================================= */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: -1;

    background-image:

        linear-gradient(
            rgba(255,255,255,0.018) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,0.018) 1px,
            transparent 1px
        );

    background-size:
        50px 50px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent 90%
        );

}


/* =========================================================
 LINKS
 ========================================================= */

a {

    color: inherit;

    text-decoration: none;

}


/* =========================================================
 CONTAINER
 ========================================================= */

.nx-container {

    width: min(
        calc(100% - 48px),
        var(--nx-container)
    );

    margin-inline: auto;

}


/* =========================================================
 HEADER
 ========================================================= */

.nx-header {

    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    height: 82px;

    z-index: 1000;

    border-bottom:
        1px solid
        rgba(255,255,255,0.07);

    background:
        rgba(5,8,13,0.82);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

}


.nx-header-inner {

    height: 100%;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 40px;

}


/* =========================================================
 BRAND
 ========================================================= */

.nx-brand {

    display: flex;

    align-items: center;

    gap: 14px;

    min-width: max-content;

}


.nx-brand-mark {

    width: 42px;
    height: 42px;

    display: grid;

    place-items: center;

    border:
        1px solid
        rgba(57,168,255,0.45);

    background:
        linear-gradient(
            145deg,
            rgba(22,140,255,0.18),
            rgba(0,217,255,0.04)
        );

    box-shadow:
        0 0 30px
        rgba(22,140,255,0.12);

}


.nx-brand-mark span {

    width: 14px;
    height: 14px;

    border:
        2px solid
        var(--nx-blue-bright);

    transform:
        rotate(45deg);

    box-shadow:
        0 0 15px
        rgba(57,168,255,0.7);

}


.nx-brand-text {

    display: flex;

    flex-direction: column;

    line-height: 1.05;

}


.nx-brand-name {

    font-family:
        "Space Grotesk",
        sans-serif;

    font-size: 15px;

    font-weight: 800;

    letter-spacing: 0.12em;

}


.nx-brand-sub {

    margin-top: 4px;

    color: var(--nx-muted);

    font-size: 8px;

    font-weight: 600;

    letter-spacing: 0.22em;

}


/* =========================================================
 NAVIGATION
 ========================================================= */

.nx-nav {

    display: flex;

    align-items: center;

    gap: 30px;

}


.nx-nav a {

    position: relative;

    color: #aeb9c7;

    font-size: 13px;

    font-weight: 600;

    transition:
        color 0.25s ease;

}


.nx-nav a::after {

    content: "";

    position: absolute;

    left: 0;
    right: 0;

    bottom: -8px;

    height: 1px;

    transform:
        scaleX(0);

    transform-origin:
        left;

    background:
        var(--nx-blue-bright);

    transition:
        transform 0.25s ease;

}


.nx-nav a:hover {

    color: white;

}


.nx-nav a:hover::after {

    transform:
        scaleX(1);

}


/* =========================================================
 HEADER CTA
 ========================================================= */

.nx-header-cta {

    padding:
        11px 18px;

    border:
        1px solid
        rgba(57,168,255,0.45);

    background:
        rgba(22,140,255,0.08);

    color: white;

    font-size: 12px;

    font-weight: 700;

    letter-spacing: 0.04em;

    transition:
        all 0.25s ease;

}


.nx-header-cta:hover {

    background:
        var(--nx-blue);

    border-color:
        var(--nx-blue);

    box-shadow:
        0 0 30px
        rgba(22,140,255,0.3);

}


/* =========================================================
 HERO
 ========================================================= */

.nx-hero {

    position: relative;

    min-height:
        100vh;

    padding-top:
        82px;

    display: flex;

    align-items: center;

    overflow: hidden;

}


/* =========================================================
 HERO ATMOSPHERE
 ========================================================= */

.nx-hero::before {

    content: "";

    position: absolute;

    width: 900px;
    height: 900px;

    right: -350px;
    top: 50%;

    transform:
        translateY(-50%);

    background:
        radial-gradient(
            circle,
            rgba(0,150,255,0.13),
            transparent 65%
        );

    pointer-events: none;

}


.nx-hero::after {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    background:
        linear-gradient(
            90deg,
            rgba(5,8,13,0.95) 0%,
            rgba(5,8,13,0.75) 48%,
            rgba(5,8,13,0.18) 100%
        );

}


/* =========================================================
 HERO CONTENT
 ========================================================= */

.nx-hero-inner {

    position: relative;

    z-index: 2;

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        minmax(480px, 0.9fr);

    gap: 70px;

    align-items: center;

    padding:
        90px 0 100px;

}


/* =========================================================
 EYEBROW
 ========================================================= */

.nx-eyebrow {

    display: inline-flex;

    align-items: center;

    gap: 10px;

    margin-bottom: 25px;

    color:
        var(--nx-blue-bright);

    font-size: 11px;

    font-weight: 800;

    letter-spacing: 0.2em;

    text-transform:
        uppercase;

}


.nx-eyebrow::before {

    content: "";

    width: 28px;

    height: 1px;

    background:
        var(--nx-blue-bright);

    box-shadow:
        0 0 12px
        var(--nx-blue-bright);

}


/* =========================================================
 HERO TITLE
 ========================================================= */

.nx-hero h1 {

    max-width:
        780px;

    font-family:
        "Space Grotesk",
        sans-serif;

    font-size:
        clamp(52px, 6.2vw, 94px);

    line-height:
        0.98;

    letter-spacing:
        -0.055em;

    font-weight:
        700;

}


.nx-hero h1 span {

    display: block;

    color:
        var(--nx-blue-bright);

    text-shadow:
        0 0 45px
        rgba(57,168,255,0.18);

}


/* =========================================================
 HERO DESCRIPTION
 ========================================================= */

.nx-hero-description {

    max-width:
        680px;

    margin-top:
        30px;

    color:
        var(--nx-text);

    font-size:
        17px;

    line-height:
        1.8;

}


.nx-hero-description strong {

    color:
        white;

    font-weight:
        700;

}


/* =========================================================
 HERO BUTTONS
 ========================================================= */

.nx-hero-actions {

    display: flex;

    flex-wrap: wrap;

    gap: 14px;

    margin-top:
        38px;

}


.nx-btn {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 10px;

    min-height:
        52px;

    padding:
        0 22px;

    border:
        1px solid
        transparent;

    font-size:
        12px;

    font-weight:
        800;

    letter-spacing:
        0.08em;

    text-transform:
        uppercase;

    transition:
        all 0.3s ease;

    cursor: pointer;

}


.nx-btn-primary {

    background:
        var(--nx-blue);

    color:
        white;

    box-shadow:
        0 0 35px
        rgba(22,140,255,0.2);

}


.nx-btn-primary:hover {

    background:
        var(--nx-blue-bright);

    transform:
        translateY(-2px);

    box-shadow:
        0 0 45px
        rgba(22,140,255,0.38);

}


.nx-btn-secondary {

    border-color:
        rgba(255,255,255,0.16);

    background:
        rgba(255,255,255,0.025);

    color:
        white;

}


.nx-btn-secondary:hover {

    border-color:
        rgba(57,168,255,0.45);

    background:
        rgba(22,140,255,0.07);

}


/* =========================================================
 HERO CONTACT
 ========================================================= */

.nx-hero-contact {

    display: flex;

    align-items: center;

    gap: 12px;

    margin-top:
        30px;

    color:
        var(--nx-muted);

    font-size:
        12px;

}


.nx-hero-contact-dot {

    width: 7px;
    height: 7px;

    border-radius:
        50%;

    background:
        #25d366;

    box-shadow:
        0 0 12px
        rgba(37,211,102,0.7);

}


.nx-hero-contact a {

    color:
        #dbe6f2;

    font-weight:
        700;

}


.nx-hero-contact a:hover {

    color:
        var(--nx-blue-bright);

}


/* =========================================================
 SECURITY ARCHITECTURE VISUAL
 ========================================================= */

.nx-architecture {

    position: relative;

    min-height:
        560px;

    display:
        grid;

    place-items:
        center;

}


/* =========================================================
 TECHNICAL DISPLAY
 ========================================================= */

.nx-system-display {

    position: relative;

    width:
        min(100%, 590px);

    aspect-ratio:
        1 / 1;

    border:
        1px solid
        rgba(57,168,255,0.22);

    background:

        linear-gradient(
            135deg,
            rgba(15,26,39,0.88),
            rgba(5,10,16,0.92)
        );

    box-shadow:
        var(--nx-shadow);

    overflow:
        hidden;

}


.nx-system-display::before {

    content: "";

    position: absolute;

    inset: 0;

    background-image:

        linear-gradient(
            rgba(57,168,255,0.055) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(57,168,255,0.055) 1px,
            transparent 1px
        );

    background-size:
        40px 40px;

    opacity: 0.6;

    pointer-events: none;

}

</style>

</head>
