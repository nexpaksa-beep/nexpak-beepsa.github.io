<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Price List - Nexpak Solutions Packaging & PPE</title>

<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
body {
    margin:0;
    font-family:Inter, sans-serif;
    background:#f8fafc;
    color:#1f2937;
}

/* NAV */
.navbar {
    background:#0f172a;
    color:white;
    padding:15px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
}

.navbar a {
    color:white;
    margin:0 10px;
    text-decoration:none;
}

/* HEADER */
.page-header {
    text-align:center;
    padding:60px 20px;
    background:linear-gradient(135deg,#0f172a,#2563eb);
    color:white;
}

/* CATEGORY */
.price-category {
    background:white;
    margin:20px auto;
    padding:20px;
    border-radius:10px;
    max-width:1000px;
    border:1px solid #e5e7eb;
}

.price-category h2 {
    margin-bottom:10px;
}

/* BUTTON */
.btn {
    display:inline-block;
    padding:10px 16px;
    border-radius:6px;
    font-weight:600;
    text-decoration:none;
    margin-top:10px;
    cursor:pointer;
}

.btn-primary {
    background:#2563eb;
    color:white;
}

.btn-wa {
    background:#25D366;
    color:white;
}

/* FLOAT BUTTON */
.whatsapp-float {
    position:fixed;
    bottom:20px;
    right:20px;
    background:#25D366;
    color:white;
    padding:15px;
    border-radius:50%;
    font-size:22px;
}

/* FOOTER */
footer {
    background:#0f172a;
    color:white;
    text-align:center;
    padding:30px;
    margin-top:40px;
}
</style>
</head>

<body>

<!-- NAV -->
<div class="navbar">
    <div><b>Nexpak Solutions</b></div>
    <div>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="Products.html">Products</a>
        <a href="products1.html">Price List</a>
        <a href="contact.html">Contact</a>
    </div>
</div>

<!-- HEADER -->
<section class="page-header">
    <h1>Request Pricing via WhatsApp</h1>
    <p>No fixed prices shown — get instant wholesale quote</p>
</section><nav>
  <a href="index.html">Home</a>
  <a href="Products.html">Products</a>
  <a href="products1.html">Price List</a>
</nav>

<!-- CTA -->
<div class="price-category" style="text-align:center;">
    <h2>Dont find it here? we will source it.</h2>
    <p>Request a quote</p>
    <a class="btn btn-primary" href="pricelist.html" target="_blank">View Catalogue</a>
</div>

<!-- WHATSAPP FLOAT -->
<a class="whatsapp-float wa-global">
    <i class="fab fa-whatsapp"></i>
</a>

<!-- SCRIPT -->
<script>
const phone = "27836308249";

/* category buttons */
document.querySelectorAll(".wa-btn").forEach(btn => {
    btn.addEventListener("click", function () {
        const product = this.getAttribute("data-product");
        const msg = `Hi Nexpak, I need pricing for: ${product}. Please send me a quote.`;
        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, "_blank");
    });
});

/* floating button */
document.querySelector(".wa-global").addEventListener("click", () => {
    const msg = "Hi Nexpak, I need a full price list.";
    window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, "_blank");
});
</script>

</body>
</html>
