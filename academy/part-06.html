                </p>

                <p>
                    Electric-fence equipment can generate high
                    voltage pulses. The fact that the pulses are
                    controlled does not remove the requirement for
                    proper electrical safety procedures.
                </p>


                <div class="info-card">

                    <h3>
                        Basic Safety Principles
                    </h3>

                    <ul>

                        <li>
                            Understand the equipment before working
                            on it
                        </li>

                        <li>
                            Follow the manufacturer's instructions
                        </li>

                        <li>
                            Use appropriate personal protective
                            equipment
                        </li>

                        <li>
                            Isolate equipment before maintenance
                        </li>

                        <li>
                            Prevent accidental re-energisation
                        </li>

                        <li>
                            Use suitable test equipment
                        </li>

                        <li>
                            Maintain safe working practices around
                            electrical services
                        </li>

                        <li>
                            Stop work when an unsafe condition is
                            identified
                        </li>

                    </ul>

                </div>


                <h3>
                    Working Near Other Electrical Services
                </h3>

                <p>
                    Electric-fence installations may be located
                    near mains electrical wiring, distribution
                    equipment, telecommunications systems, solar
                    equipment and other services.
                </p>

                <p>
                    The installer must identify potential
                    interactions and maintain the required
                    separation and protection according to the
                    applicable requirements.
                </p>


                <h3>
                    Weather And Environmental Conditions
                </h3>

                <p>
                    Outdoor electrical equipment is exposed to
                    environmental conditions such as rain,
                    humidity, dust, heat and UV exposure.
                </p>

                <p>
                    Equipment and installation methods must be
                    suitable for the environment in which they are
                    installed.
                </p>


                <div class="warning-card">

                    <h3>
                        Never Work On An Energised Fence
                    </h3>

                    <p>
                        Maintenance and installation work must be
                        performed using the appropriate isolation
                        and safety procedures. Do not work directly
                        on an energised electric-fence circuit.
                    </p>

                </div>


                <h3>
                    Safety Is A Professional Responsibility
                </h3>

                <p>
                    A professional installer is responsible not
                    only for getting the fence operational, but
                    also for recognising unsafe conditions and
                    preventing unnecessary risk to workers,
                    customers and other people who may interact
                    with the installation.
                </p>

            </section>


            <!-- =================================
                 05. ELECTRIC FENCE CERTIFICATION
            ================================== -->

            <section
                id="certificate"
                class="lesson-section"
            >

                <div class="section-number">
                    05
                </div>

                <h2>
                    Electric Fence Certification
                </h2>

                <p>
                    Electric-fence certification is an important
                    part of professional practice in South Africa.
                </p>

                <p>
                    Certification requirements should never be
                    treated as simply a piece of paperwork issued
                    at the end of a project. Certification is
                    associated with the verification of an
                    installation against the applicable
                    requirements.
                </p>


                <div class="info-card">

                    <h3>
                        Certification Principles
                    </h3>

                    <ul>

                        <li>
                            The installation must be assessed
                        </li>

                        <li>
                            Relevant technical requirements must
                            be considered
                        </li>

                        <li>
                            Required tests must be performed
                        </li>

                        <li>
                            Defects must be identified and
                            addressed
                        </li>

                        <li>
                            Appropriate documentation must be
                            completed
                        </li>

                        <li>
                            Certification must be handled by a
                            person who is legally authorised to
                            perform the relevant certification
                        </li>

                    </ul>

                </div>


                <h3>
                    Installation Versus Certification
                </h3>

                <p>
                    Installing an electric fence and certifying
                    an installation are related but distinct
                    responsibilities.
                </p>

                <p>
                    A person who performs installation work should
                    not automatically assume that they have the
                    legal authority to issue every certificate
                    associated with that installation.
                </p>


                <h3>
                    Certificate Of Compliance
                </h3>

                <p>
                    Where a Certificate of Compliance or other
                    prescribed certification is required, the
                    installer must understand who is authorised
                    to issue it and what inspection and testing
                    requirements apply.
                </p>

                <p>
                    Current South African legal and regulatory
                    requirements must be verified before a
                    certificate is issued.
                </p>


                <div class="warning-card">

                    <h3>
                        Never Sign A Certificate You Cannot Legally
                        Issue
                    </h3>

                    <p>
                        Certification carries professional and
                        legal responsibility. Never sign or issue
                        certification outside your legal authority,
                        competence or scope of responsibility.
                    </p>

                </div>


                <div class="success-card">

                    <h3>
                        Professional Standard
                    </h3>

                    <p>
                        Treat certification as evidence that the
                        installation has been properly inspected
                        and verified — not as an administrative
                        formality.
                    </p>

                </div>

            </section>


            <!-- =================================
                 06. INSTALLER RESPONSIBILITIES
            ================================== -->

            <section
                id="installer"
                class="lesson-section"
            >

                <div class="section-number">
                    06
                </div>

                <h2>
                    Installer Responsibilities
                </h2>

                <p>
                    A professional electric-fence installer has
                    responsibilities that extend beyond physically
                    mounting components and connecting conductors.
                </p>

                <p>
                    The installer must approach each project with
                    safety, technical competence, compliance and
                    customer protection in mind.
                </p>


                <div class="info-card">

                    <h3>
                        Core Responsibilities
                    </h3>

                    <ul>

                        <li>
                            Assess the site correctly
                        </li>

                        <li>
                            Identify potential hazards
                        </li>

                        <li>
                            Design the system appropriately
                        </li>

                        <li>
                            Select suitable equipment
                        </li>

                        <li>
                            Follow manufacturer instructions
                        </li>

                        <li>
                            Follow applicable standards and
                            regulations
                        </li>

                        <li>
                            Perform appropriate testing
                        </li>

                        <li>
                            Correct identified defects
                        </li>

                        <li>
                            Maintain installation records
                        </li>

                        <li>
                            Provide appropriate customer
                            information
                        </li>

                    </ul>

                </div>


                <h3>
                    Competence And Training
                </h3>

                <p>
                    Electric-fence work should only be performed
                    within the limits of the installer's training,
                    competence, authorisation and legal scope.
                </p>

                <p>
                    When a task falls outside those limits, it
                    should be referred to an appropriately
                    qualified or authorised person.
                </p>


                <h3>
                    Identifying Unsafe Conditions
                </h3>

                <p>
                    Installers may encounter existing electrical
                    installations, damaged structures, exposed
                    conductors, unsafe access conditions or other
                    hazards.
                </p>

                <p>
                    The correct professional response is to stop,
                    assess the risk and take appropriate corrective
                    action rather than continuing simply to meet a
                    deadline.
                </p>


                <div class="warning-card">

                    <h3>
                        Never Sacrifice Safety For Speed
                    </h3>

                    <p>
                        A faster installation is not a successful
                        installation if it creates an unsafe
                        condition or fails to meet the applicable
                        requirements.
                    </p>

                </div>

            </section>


            <!-- =================================
                 07. INSTALLATION DOCUMENTATION
            ================================== -->

            <section
                id="documentation"
                class="lesson-section"
            >

                <div class="section-number">
                    07
                </div>

                <h2>
                    Installation Documentation
                </h2>

                <p>
                    Professional documentation provides a record
                    of what was installed, how the system was
                    configured and what was verified during
                    commissioning.
                </p>

                <p>
                    Good documentation also makes future
                    maintenance and fault finding considerably
                    easier.
                </p>


                <div class="info-card">

                    <h3>
                        Recommended Installation Records
                    </h3>

                    <ul>

                        <li>
                            Customer and site information
                        </li>

                        <li>
                            Installation date
                        </li>

                        <li>
                            System description
                        </li>

                        <li>
                            Energizer information
                        </li>

                        <li>
                            Fence layout
                        </li>

                        <li>
                            Isolation points
                        </li>

                        <li>
                            Earth system information
                        </li>

                        <li>
                            Equipment used
                        </li>

                        <li>
                            Electrical test results
                        </li>

                        <li>
                            Defects identified
                        </li>

                        <li>
                            Corrective work performed
                        </li>

                        <li>
                            Final commissioning information
                        </li>

                    </ul>

                </div>


                <h3>
                    Photographic Records
                </h3>

                <p>
                    Photographs can provide useful evidence of the
                    completed installation and can assist future
                    technicians.
                </p>

                <p>
                    Where appropriate, record important areas such
                    as energizer installation, earth arrangements,
                    isolation points, gates, corners and unusual
                    installation conditions.
                </p>


                <h3>
                    As-Built Information
                </h3>

                <p>
                    The final documentation should represent the
                    installation that actually exists on site,
                    rather than the original plan if changes were
                    made during construction.
                </p>


                <div class="success-card">

                    <h3>
                        Professional Principle
                    </h3>

                    <p>
                        If another competent technician had to
                        service the installation in the future,
                        your documentation should give them enough
                        information to understand the system.
                    </p>

                </div>

    </section>

                        <!-- =================================
                 08. SAFETY & WARNING SIGNAGE
            ================================== -->

            <section
                id="signage"
                class="lesson-section"
            >

                <div class="section-number">
                    08
                </div>

                <h2>
                    Safety &amp; Warning Signage
                </h2>

                <p>
                    Warning signage is an important safety feature
                    of an electric-fence installation. It provides
                    visible information that alerts people to the
                    presence of an electric fence.
                </p>

                <p>
                    Signage requirements must be determined from
                    the applicable South African requirements and
                    the specific installation conditions.
                </p>


                <div class="info-card">

                    <h3>
                        Signage Considerations
                    </h3>

                    <ul>

                        <li>
                            Appropriate warning wording
                        </li>

                        <li>
                            Visibility
                        </li>

                        <li>
                            Suitable positioning
                        </li>

                        <li>
                            Durable construction
                        </li>

                        <li>
                            Resistance to environmental exposure
                        </li>

                        <li>
                            Visibility from relevant approaches
                        </li>

                        <li>
                            Compliance with applicable requirements
                        </li>

                    </ul>

                </div>


                <h3>
                    Sign Visibility
                </h3>

                <p>
                    A warning sign cannot perform its intended
                    purpose if it is hidden behind vegetation,
                    structures or other objects.
                </p>

                <p>
                    During inspection, the installer should verify
                    that required signage remains clearly visible.
                </p>


                <h3>
                    Damaged Signs
                </h3>

                <p>
                    Faded, damaged, missing or obscured warning
                    signs should be identified during maintenance
                    inspections and replaced where required.
                </p>


                <div class="warning-card">

                    <h3>
                        Do Not Guess Signage Requirements
                    </h3>

                    <p>
                        Signage dimensions, positioning and other
                        requirements should be verified against the
                        current applicable requirements rather than
                        copied from an unrelated installation.
                    </p>

                </div>

            </section>


            <!-- =================================
                 09. PROPERTY & BOUNDARY
            ================================== -->

            <section
                id="property"
                class="lesson-section"
            >

                <div class="section-number">
                    09
                </div>

                <h2>
                    Property &amp; Boundary Considerations
                </h2>

                <p>
                    Electric fences are frequently installed along
                    property boundaries. This creates additional
                    considerations that must be addressed during
                    site assessment and system design.
                </p>

                <p>
                    The installer must understand where the
                    client's property ends and must avoid making
                    assumptions about ownership, access rights or
                    boundary positions.
                </p>


                <div class="info-card">

                    <h3>
                        Boundary Considerations
                    </h3>

                    <ul>

                        <li>
                            Confirm the intended fence position
                        </li>

                        <li>
                            Consider existing boundary structures
                        </li>

                        <li>
                            Identify neighbouring property risks
                        </li>

                        <li>
                            Consider access areas
                        </li>

                        <li>
                            Identify shared or disputed structures
                        </li>

                        <li>
                            Consider gates and pedestrian access
                        </li>

                        <li>
                            Record significant site conditions
                        </li>

                    </ul>

                </div>


                <h3>
                    Do Not Assume The Boundary
                </h3>

                <p>
                    A visible wall, fence or hedge does not
                    automatically prove the legal property boundary.
                </p>

                <p>
                    Where the exact boundary is important to the
                    installation, the client should provide
                    appropriate confirmation before work proceeds.
                </p>


                <h3>
                    Neighbouring Properties
                </h3>

                <p>
                    Installers should consider whether the proposed
                    fence could affect neighbouring property,
                    shared structures, access routes or other
                    installations.
                </p>

                <p>
                    Where a legal or ownership issue exists, it
                    should be referred to the property owner or
                    appropriate professional rather than decided
                    by the installer.
                </p>


                <div class="warning-card">

                    <h3>
                        Do Not Resolve Boundary Disputes Yourself
                    </h3>

                    <p>
                        An installer should not determine ownership
                        or settle a property dispute. Document the
                        issue and obtain appropriate instruction
                        before continuing.
                    </p>

                </div>

            </section>


            <!-- =================================
                 10. INSPECTION & VERIFICATION
            ================================== -->

            <section
                id="inspection"
                class="lesson-section"
            >

                <div class="section-number">
                    10
                </div>

                <h2>
                    Inspection &amp; Verification
                </h2>

                <p>
                    Inspection is the process of checking whether
                    the completed installation meets the intended
                    design and applicable requirements.
                </p>

                <p>
                    Verification combines physical inspection,
                    appropriate electrical testing, documentation
                    review and functional checks.
                </p>


                <div class="info-card">

                    <h3>
                        Inspection Areas
                    </h3>

                    <ul>

                        <li>
                            Fence structure
                        </li>

                        <li>
                            Conductors
                        </li>

                        <li>
                            Insulators
                        </li>

                        <li>
                            Corners and direction changes
                        </li>

                        <li>
                            Gates
                        </li>

                        <li>
                            Clearances
                        </li>

                        <li>
                            Vegetation
                        </li>

                        <li>
                            Energizer
                        </li>

                        <li>
                            Earth system
                        </li>

                        <li>
                            High-voltage connections
                        </li>

                        <li>
                            Warning signage
                        </li>

                        <li>
                            Monitoring equipment
                        </li>

                    </ul>

                </div>


                <h3>
                    Visual Inspection
                </h3>

                <p>
                    Start with a complete visual inspection of the
                    installation before relying on electrical
                    measurements.
                </p>

                <p>
                    Visible defects should be identified and
                    corrected before the system is considered
                    complete.
                </p>


                <h3>
                    Electrical Verification
                </h3>

                <p>
                    Appropriate electrical tests should be carried
                    out using suitable instruments and procedures.
                </p>

                <p>
                    Results should be compared with the applicable
                    technical requirements and manufacturer
                    specifications.
                </p>


                <h3>
                    Functional Verification
                </h3>

                <p>
                    Where the fence forms part of a larger security
                    system, relevant alarm, monitoring and
                    communication functions should also be checked.
                </p>


                <div class="success-card">

                    <h3>
                        Three Questions
                    </h3>

                    <p>
                        Before handover, ask:
                    </p>

                    <ul>

                        <li>
                            Is the installation physically sound?
                        </li>

                        <li>
                            Does the electrical system operate
                            correctly?
                        </li>

                        <li>
                            Has the installation been documented
                            and verified appropriately?
                        </li>

                    </ul>

                </div>

            </section>


            <!-- =================================
                 11. PROFESSIONAL CONDUCT
            ================================== -->

            <section
                id="professional"
                class="lesson-section"
            >

                <div class="section-number">
                    11
                </div>

                <h2>
                    Professional Conduct
                </h2>

                <p>
                    Technical competence is only one part of being
                    a professional security installer.
                </p>

                <p>
                    The way an installer communicates, documents
                    work, manages risks and deals with customers
                    also affects the reputation and reliability of
                    the security industry.
                </p>


                <div class="info-card">

                    <h3>
                        Professional Standards
                    </h3>

                    <ul>

                        <li>
                            Be honest about your competence
                        </li>

                        <li>
                            Do not make unsupported compliance
                            claims
                        </li>

                        <li>
                            Do not conceal defects
                        </li>

                        <li>
                            Document important changes
                        </li>

                        <li>
                            Protect customer information
                        </li>

                        <li>
                            Use appropriate equipment
                        </li>

                        <li>
                            Follow safe working practices
                        </li>

                        <li>
                            Keep technical knowledge current
                        </li>

                    </ul>

                </div>


                <h3>
                    Never Hide A Defect
                </h3>

                <p>
                    If an installation has a defect, the correct
                    professional response is to identify it,
                    explain the issue and correct it where
                    possible.
                </p>

                <p>
                    A hidden defect can become a safety problem,
                    a security failure or a much more expensive
                    service issue later.
                </p>


                <h3>
                    Customer Communication
                </h3>

                <p>
                    Customers should receive clear information
                    about the system they are purchasing,
                    including relevant operating, safety and
                    maintenance considerations.
                </p>


                <div class="warning-card">

                    <h3>
                        Never Promise What The System Cannot Do
                    </h3>

                    <p>
                        An electric fence is one component of a
                        security strategy. Do not represent it as
                        providing protection beyond the actual
                        capabilities and design of the system.
                    </p>

                </div>


                <div class="success-card">

                    <h3>
                        Your Reputation Is Part Of The Product
                    </h3>

                    <p>
                        A professional installation should leave
                        the customer with confidence in both the
                        system and the person who installed it.
                    </p>

                </div>

            </section>


            <!-- =================================
                 12. COMPLIANCE CHECKLIST
            ================================== -->

            <section
                id="compliance-check"
                class="lesson-section"
            >

                <div class="section-number">
                    12
                </div>

                <h2>
                    Compliance Checklist
                </h2>

                <p>
                    Before completing an electric-fence project,
                    the installer should perform a structured
                    final review.
                </p>

                <p>
                    The checklist below provides a training
                    framework. The actual requirements must always
                    be checked against the current applicable
                    South African legislation, regulations,
                    standards and manufacturer instructions.
                </p>


                <div class="info-card">

                    <h3>
                        Final Compliance Review
                    </h3>

                    <ul>

                        <li>
                            Site requirements have been assessed
                        </li>

                        <li>
                            System design has been reviewed
                        </li>

                        <li>
                            Suitable equipment has been selected
                        </li>

                        <li>
                            Installation follows manufacturer
                            requirements
                        </li>

                        <li>
                            Applicable standards have been
                            considered
                        </li>

                        <li>
                            Safety requirements have been addressed
                        </li>

                        <li>
                            Fence structure has been inspected
                        </li>

                        <li>
                            Electrical connections have been
                            inspected
                        </li>

                        <li>
                            Earth system has been verified
                        </li>

                        <li>
                            Required electrical tests have been
                            completed
                        </li>

                        <li>
                            Warning signage has been checked
                        </li>

                        <li>
                            Alarm and monitoring functions have
                            been verified where applicable
                        </li>

                        <li>
                            Installation documentation is complete
                        </li>

                        <li>
                            Required certification has been
                            addressed by the appropriately
                            authorised person
                        </li>

                        <li>
                            Customer handover requirements have
                            been completed
                        </li>

                    </ul>

                </div>


                <h3>
                    The Professional Installer Mindset
                </h3>

                <p>
                    Compliance should be built into the project
                    from the first site assessment through to
                    final handover.
                </p>

                <p>
                    The objective is not simply to install a fence
                    that works today. The objective is to create a
                    safe, reliable, maintainable and appropriately
                    documented security installation.
                </p>
