<style>
:root {
    --primary-navy: #000080; 
    --dark-navy: #040914;
    --nav-bg: #081225;
    --hero-blue-start: #061126;
    --hero-blue-end: #0052cc;
    --accent-blue: #0066ff;
    --accent-cyan: #00f0ff;
    --bg-light: #f1f5f9;

    --border-color: #cbd5e1;
    --text-dark: #0f172a;
    --text-muted: #64748b;
    --danger: #dc2626;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
body { background: var(--bg-light); color: var(--text-dark); position: relative; min-height: 100vh; }
button, input, select { font-family: inherit; outline: none; }
button { cursor: pointer; }
