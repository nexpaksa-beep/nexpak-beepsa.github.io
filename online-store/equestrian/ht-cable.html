            .hero {

            }


            .hero-text {

                font-size:
                    15px;

            }


            .definition-grid,
            .comparison-grid {

            .intro-card {

                padding:

            }

                    1fr;

            }

        @media (
            max-width: 450px

            .brand {

                font-size:
                    17px;

            }


            .back-link {

                font-size:
                    11px;

                padding:
                    8px 9px;

            }


            .hero h1 {

                font-size:
                    34px;

            }


            .hero-tag {

                font-size:
                    10px;

            }


            .content-section h2 {

                font-size:
                    24px;

            }

        }
