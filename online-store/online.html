<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        NEXPAK Security Store
    </title>


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- =====================================================
         STORE CSS
    ====================================================== -->

    <style>

        :root {

            --navy:
                #07182e;

            --navy-2:
                #061e3d;

            --blue:
                #0066ff;

            --blue-dark:
                #0052cc;

            --blue-light:
                #eaf2ff;

            --green:
                #16a34a;

            --bg:
                #f4f6f9;

            --white:
                #ffffff;

            --border:
                #e2e8f0;

            --text:
                #0f172a;

            --muted:
                #64748b;

            --danger:
                #dc2626;

            --shadow:
                0 4px 16px rgba(
                    15,
                    23,
                    42,
                    .08
                );

        }


        * {

            box-sizing:
                border-box;

            margin:
                0;

            padding:
                0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        body {

            background:
                var(--bg);

            color:
                var(--text);

        }


        button,
        input,
        select {

            font:
                inherit;

        }


        button {

            cursor:
                pointer;

        }


        a {

            text-decoration:
                none;

        }


        /* =================================================
           HEADER
        ================================================= */

        .top-header {

            background:
                #ffffff;

            border-bottom:
                1px solid var(--border);

            min-height:
                68px;

            padding:
                10px 24px;

            display:
                flex;

            align-items:
                center;

            gap:
                20px;

            position:
                relative;

            z-index:
                100;

        }


        .logo-container {

            flex:
                0 0 auto;

            display:
                flex;

            align-items:
                center;

        }


        .logo-container img {

            width:
                145px;

            max-height:
                48px;

            object-fit:
                contain;

        }


        .logo-fallback {

            display:
                none;

            font-size:
                23px;

            font-weight:
                900;

            color:
                var(--navy);

        }


        /* =================================================
           SEARCH
        ================================================= */

        .search-bar {

            flex:
                1;

            max-width:
                560px;

            height:
                40px;

            display:
                flex;

            border:
                1px solid var(--border);

            border-radius:
                5px;

            overflow:
                hidden;

            background:
                #ffffff;

        }


        .search-bar input {

            flex:
                1;

            border:
                0;

            outline:
                0;

            padding:
                0 14px;

            font-size:
                13px;

        }


        .search-bar button {

            width:
                48px;

            border:
                0;

            color:
                white;

            background:
                var(--blue);

        }


        /* =================================================
           HEADER ACTIONS
        ================================================= */

        .header-actions {

            margin-left:
                auto;

            display:
                flex;

            align-items:
                center;

            gap:
                18px;

        }


        .header-action-item {

            border:
                0;

            background:
                transparent;

            color:
                var(--text);

            font-size:
                12px;

            font-weight:
                600;

            display:
                flex;

            align-items:
                center;

            gap:
                6px;

            position:
                relative;

        }


        .header-action-item i {

            font-size:
                17px;

        }


        .badge-icon {

            position:
                relative;

        }


        .badge {

            position:
                absolute;

            top:
                -9px;

            right:
                -10px;

            width:
                16px;

            height:
                16px;

            border-radius:
                50%;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            background:
                var(--blue);

            color:
                white;

            font-size:
                9px;

            font-weight:
                800;

        }


        /* =================================================
           NAVIGATION
        ================================================= */

        .nav-bar {

            background:
                var(--navy);

            min-height:
                43px;

            padding:
                0 24px;

            display:
                flex;

            align-items:
                center;

            gap:
                26px;

            overflow-x:
                auto;

            white-space:
                nowrap;

        }


        .nav-link {

            border:
                0;

            background:
                transparent;

            color:
                #ffffff;

            font-size:
                12px;

            font-weight:
                700;

            padding:
                13px 0;

            display:
                flex;

            align-items:
                center;

            gap:
                7px;

            opacity:
                .9;

        }


        .nav-link:hover,
        .nav-link.active {

            opacity:
                1;

            color:
                #66a3ff;

        }


        /* =================================================
           HERO
        ================================================= */

        .hero-banner {

            background:
                linear-gradient(
                    110deg,
                    var(--navy-2) 35%,
                    var(--blue-dark) 100%
                );

            color:
                white;

            padding:
                44px 28px;

        }


        .hero-content {

            max-width:
                1280px;

            margin:
                auto;

        }


        .hero-subtitle {

            font-size:
                11px;

            font-weight:
                800;

            letter-spacing:
                1.5px;

            opacity:
                .7;

            margin-bottom:
                8px;

        }


        .hero-title {

            font-size:
                34px;

            line-height:
                1.15;

            font-weight:
                900;

            margin-bottom:
                12px;

        }


        .hero-desc {

            max-width:
                540px;

            font-size:
                14px;

            line-height:
                1.5;

            opacity:
                .82;

        }


        /* =================================================
           STORE
        ================================================= */

        .container {

            max-width:
                1280px;

            margin:
                0 auto;

            padding:
                28px 16px 80px;

        }


        .store-tag {

            color:
                var(--blue);

            font-size:
                11px;

            font-weight:
                800;

            text-transform:
                uppercase;

            letter-spacing:
                .7px;

        }


        .section-title {

            font-size:
                26px;

            font-weight:
                900;

            margin:
                5px 0 24px;

        }


        .catalogue-section {

            margin-bottom:
                38px;

        }


        .category-title {

            display:
                flex;

            align-items:
                center;

            gap:
                9px;

            font-size:
                18px;

            font-weight:
                800;

            margin-bottom:
                15px;

        }


        .category-title i {

            color:
                var(--blue);

        }


        /* =================================================
           PRODUCT GRID
        ================================================= */

        .card-grid {

            display:
                grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(
                        260px,
                        1fr
                    )
                );

            gap:
                17px;

        }


        /* =================================================
           PRODUCT CARD
        ================================================= */

        .product-card {

            background:
                white;

            border:
                1px solid var(--border);

            border-radius:
                8px;

            padding:
                13px;

            position:
                relative;

            display:
                flex;

            flex-direction:
                column;

            box-shadow:
                var(--shadow);

            transition:
                transform .18s ease,
                box-shadow .18s ease;

        }


        .product-card:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 8px 24px rgba(
                    15,
                    23,
                    42,
                    .12
                );

        }


        .wishlist-btn {

            position:
                absolute;

            right:
                14px;

            top:
                14px;

            width:
                31px;

            height:
                31px;

            border:
                1px solid var(--border);

            border-radius:
                50%;

            background:
                white;

            color:
                var(--muted);

            z-index:
                3;

        }


        .wishlist-btn.active {

            color:
                #ef4444;

        }


        /* =================================================
           PRODUCT IMAGE
        ================================================= */

        .product-img-wrapper {

            height:
                175px;

            width:
                100%;

            background:
                #f8fafc;

            border-radius:
                6px;

            overflow:
                hidden;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            margin-bottom:
                13px;

        }


        .product-img-wrapper img {

            width:
                100%;

            height:
                100%;

            object-fit:
                contain;

        }


        .card-category {

            color:
                var(--blue);

            font-size:
                10px;

            font-weight:
                900;

            text-transform:
                uppercase;

            margin-bottom:
                5px;

        }


        .product-name {

            font-size:
                14px;

            line-height:
                1.35;

            font-weight:
                800;

            min-height:
                38px;

            margin-bottom:
                6px;

        }


        .product-desc {

            color:
                var(--muted);

            font-size:
                11px;

            line-height:
                1.45;

            min-height:
                34px;

            margin-bottom:
                11px;

        }


        /* =================================================
           SELECTORS
        ================================================= */

        .selector-container {

            background:
                #f8fafc;

            border:
                1px solid #edf2f7;

            border-radius:
                5px;

            padding:
                9px;

            margin-bottom:
                11px;

        }


        .selector-row {

            margin-bottom:
                7px;

        }


        .selector-row:last-child {

            margin-bottom:
                0;

        }


        .selector-row label {

            display:
                block;

            color:
                var(--muted);

            font-size:
                10px;

            font-weight:
                800;

            margin-bottom:
                4px;

        }


        .selector-row select {

            width:
                100%;

            min-height:
                31px;

            padding:
                5px 7px;

            border:
                1px solid var(--border);

            border-radius:
                4px;

            background:
                white;

            font-size:
                11px;

            outline:
                none;

        }


        /* =================================================
           QUANTITY
        ================================================= */

        .quantity-box {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                8px;

        }


        .quantity-controls {

            display:
                flex;

            align-items:
                center;

            border:
                1px solid var(--border);

            border-radius:
                4px;

            overflow:
                hidden;

            background:
                white;

        }


        .quantity-controls button {

            width:
                28px;

            height:
                29px;

            border:
                0;

            background:
                #f8fafc;

            font-weight:
                900;

        }


        .quantity-controls input {

            width:
                40px;

            height:
                29px;

            text-align:
                center;

            border:
                0;

            border-left:
                1px solid var(--border);

            border-right:
                1px solid var(--border);

            outline:
                0;

        }


        /* =================================================
           PRICE
        ================================================= */

        .price-text {

            font-size:
                19px;

            font-weight:
                900;

            margin:
                12px 0;

        }


        .price-text small {

            color:
                var(--muted);

            font-size:
                9px;

            font-weight:
                500;

        }


        /* =================================================
           CARD BUTTONS
        ================================================= */

        .card-actions {

            display:
                grid;

            grid-template-columns:
                1fr 1fr;

            gap:
                7px;

            margin-top:
                auto;

        }


        .btn-summary-quote,
        .btn-add-cart {

            min-height:
                36px;

            border-radius:
                4px;

            font-size:
                11px;

            font-weight:
                800;

        }


        .btn-summary-quote {

            background:
                white;

            color:
                var(--text);

            border:
                1px solid var(--border);

        }


        .btn-add-cart {

            background:
                var(--blue);

            color:
                white;

            border:
                0;

        }


        .btn-add-cart:hover {

            background:
                var(--blue-dark);

        }


        /* =================================================
           CART DRAWER
        ================================================= */

        .cart-overlay {

            position:
                fixed;

            inset:
                0;

            background:
                rgba(
                    0,
                    0,
                    0,
                    .45
                );

            z-index:
                900;

            display:
                none;

        }


        .cart-overlay.open {

            display:
                block;

        }


        .cart-drawer {

            position:
                fixed;

            top:
                0;

            right:
                -440px;

            width:
                min(
                    420px,
                    94vw
                );

            height:
                100vh;

            background:
                white;

            z-index:
                901;

            box-shadow:
                -8px 0 30px rgba(
                    0,
                    0,
                    0,
                    .18
                );

            transition:
                right .25s ease;

            display:
                flex;

            flex-direction:
                column;

        }


        .cart-drawer.open {

            right:
                0;

        }


        .cart-header {

            padding:
                17px;

            background:
                var(--navy);

            color:
                white;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

        }


        .cart-header h2 {

            font-size:
                18px;

        }


        .cart-close {

            border:
                0;

            background:
                transparent;

            color:
                white;

            font-size:
                20px;

        }


        .cart-items {

            flex:
                1;

            overflow-y:
                auto;

            padding:
                14px;

        }


        .cart-item {

                    border-bottom:
            1px solid var(--border-color);

        padding:
            12px 0;

        display:
            flex;

        gap:
            10px;

        align-items:
            flex-start;

    }


    .cart-item-image {

        width:
            58px;

        height:
            58px;

        object-fit:
            cover;

        border-radius:
            6px;

        border:
            1px solid var(--border-color);

        background:
            #f8fafc;

        flex-shrink:
            0;

    }


    .cart-item-details {

        flex:
            1;

        min-width:
            0;

    }


    .cart-item-name {

        font-size:
            12px;

        font-weight:
            700;

        line-height:
            1.35;

        margin-bottom:
            4px;

    }


    .cart-item-option {

        font-size:
            10px;

        color:
            var(--text-muted);

        margin-bottom:
            4px;

    }


    .cart-item-price {

        font-size:
            12px;

        font-weight:
            800;

        color:
            var(--accent-blue);

    }


    .cart-item-qty {

        display:
            flex;

        align-items:
            center;

        gap:
            5px;

        margin-top:
            7px;

    }


    .cart-item-qty button {

        width:
            24px;

        height:
            24px;

        border:
            1px solid var(--border-color);

        background:
            #ffffff;

        border-radius:
            4px;

        cursor:
            pointer;

        font-weight:
            700;

    }


    .cart-item-qty span {

        min-width:
            22px;

        text-align:
            center;

        font-size:
            11px;

        font-weight:
            700;

    }


    .cart-item-remove {

        border:
            none;

        background:
            transparent;

        color:
            #dc2626;

        cursor:
            pointer;

        font-size:
            11px;

        padding:
            4px;

    }


    .cart-empty {

        text-align:
            center;

        padding:
            40px 20px;

        color:
            var(--text-muted);

        font-size:
            13px;

    }


    .cart-empty i {

        font-size:
            32px;

        margin-bottom:
            10px;

        display:
            block;

        opacity:
            0.5;

    }


    .cart-summary {

        border-top:
            1px solid var(--border-color);

        padding:
            16px;

        background:
            #ffffff;

    }


    .cart-summary-row {

        display:
            flex;

        justify-content:
            space-between;

        align-items:
            center;

        font-size:
            12px;

        margin-bottom:
            8px;

    }


    .cart-summary-row.total {

        font-size:
            16px;

        font-weight:
            800;

        color:
            var(--text-dark);

        padding-top:
            8px;

        border-top:
            1px solid var(--border-color);

    }


    .cart-checkout-button {

        width:
            100%;

        margin-top:
            12px;

        padding:
            11px;

        border:
            none;

        border-radius:
            5px;

        background:
            var(--accent-blue);

        color:
            #ffffff;

        font-size:
            12px;

        font-weight:
            800;

        cursor:
            pointer;

    }


    .cart-checkout-button:hover {

        background:
            var(--accent-blue-hover);

    }


    .cart-continue-button {

        width:
            100%;

        margin-top:
            7px;

        padding:
            9px;

        border:
            1px solid var(--border-color);

        border-radius:
            5px;

        background:
            #ffffff;

        color:
            var(--text-dark);

        font-size:
            11px;

        font-weight:
            700;

        cursor:
            pointer;

    }

       CHECKOUT OVERLAY
    ===================================================== */
