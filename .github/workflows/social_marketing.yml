name: Daily Social Media Automation

on:
  schedule:
    # This tells GitHub to run the script automatically every day at 07:00 AM UTC
    - cron: '0 7 * * *'
  workflow_dispatch: # This allows you to manually press a button to trigger a post anytime

jobs:
  run-marketing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-node-version: '3.10'

      - name: Install required tools
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Marketing Automation Script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: python social_marketing.py
        
