<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexpak Shop - Online Store</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shop-styles.css">
</head>

<body>

<!-- ================= CART DRAWER (TAKEALOT STYLE) ================= -->
<div id="cartOverlay" class="cart-overlay" onclick="toggleCart(false)"></div>

<div id="cartDrawer" class="cart-drawer">

    <div class="cart-header">
        <h2>Your Cart</h2>
        <button onclick="toggleCart(false)">✕</button>
    </div>

    <div id="cartItems"></div>

    <div class="cart-footer">
        <div class="cart-summary">
            <div>Subtotal: <span id="subtotal">R0.00</span></div>
            <div>Delivery: <span id="delivery">R0.00</span></div>
            <div><b>Total: <span id="total">R0.00</span></b></div>
        </div>

        <button id="checkoutBtn" onclick="proceedToCheckout()">Checkout</button>
        <button onclick="toggleCart(false)">Continue Shopping</button>
    </div>

</div>

<!-- ================= NAVBAR ================= -->
<!-- ================= NAVBAR ================= -->
<nav class="navbar">
    <div class="navbar-container">

        <div class="logo">
            <img src="logo.png" alt="Nexpak Solutions Logo">

            <div class="logo-text">
                <span class="nex">NEX</span><span class="pak">PAK</span>
                <span class="small">SOLUTIONS</span>
            </div>
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="aboutus.html">About Us</a>
            <a href="Products.html">Products</a>
            <a href="pricelist.html">Price List</a>
            <a href="contact.html">Contact</a>

            <a href="shop.html" class="active">Shop</a>

            <a href="#" class="cart-link" onclick="toggleCart(true)">
    🛒 <span id="cartCount" class="cart-count">0</span>
            </a>
            </a>
        </div>

    </div>
</nav>

<!-- ================= MAIN ================= -->
<div class="shop-container">

    <!-- FILTER -->
    <div class="filter-section">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search products...">
        </div>
        
            <button class="filter-btn active" onclick="filterCategory('all')">All</button>
            <button class="filter-btn" onclick="filterCategory('wrap')">Wraps</button>
            <button class="filter-btn" onclick="filterCategory('tape')">Tapes</button>
            <button class="filter-btn" onclick="filterCategory('boxes')">Boxes</button>
            <button class="filter-btn" onclick="filterCategory('ppe')">PPE</button>
            <button class="filter-btn" onclick="filterCategory('void')">Void Fill</button>
        </div>  
    </div>

    <!-- PRODUCTS -->
    <div class="products-section">
        <div id="productsGrid" class="products-grid"></div>
    </div>

</div>

<!-- ================= CHECKOUT MODAL ================= -->
<div id="checkoutModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">
            <h2>Checkout</h2>
            <button onclick="closeCheckout()">✕</button>
        </div>

        <form id="checkoutForm">

            <div class="form-section">
                <h3>Shipping Information</h3>

                <div class="form-row">
                    <input type="text" id="firstName" placeholder="First Name" required>
                    <input type="text" id="lastName" placeholder="Last Name" required>
                </div>

                <input type="email" id="email" placeholder="Email Address" required>
                <input type="tel" id="phone" placeholder="Phone Number" required>
                <input type="text" id="address" placeholder="Street Address" required>

                <div class="form-row">
                    <input type="text" id="city" placeholder="City" required>
                    <input type="text" id="postalCode" placeholder="Postal Code" required>
                </div>

                <textarea id="instructions" placeholder="Delivery Instructions (Optional)"></textarea>
            </div>

            <div class="form-section">
                <h3>Order Review</h3>
                <div id="orderReview"></div>
            </div>

            <div class="form-section">
                <h3>Payment Method</h3>

                <label><input type="radio" name="payment" value="stripe" checked> Card (Stripe)</label>
                <label><input type="radio" name="payment" value="eft"> EFT</label>
                <label><input type="radio" name="payment" value="cash"> Cash on Delivery</label>
            </div>

            <div class="form-actions">
                <button type="button" onclick="closeCheckout()">Back</button>
                <button type="submit">Place Order</button>
            </div>

        </form>

    </div>

</div>

<!-- ================= SUCCESS MODAL ================= -->
<div id="successModal" class="modal">

    <div class="modal-content">
        <h2>Order Confirmed!</h2>
        <p>Thank you for your order.</p>

        <div id="orderNumber"></div>

        <button onclick="returnToShop()">Continue Shopping</button>
    </div>

</div>

<!-- ================= SCRIPTS ================= -->
<script src="https://js.stripe.com/v3/"></script>
<script src="shop-data.js"></script>
<script src="shop-script.js"></script>

</body>
</html>
